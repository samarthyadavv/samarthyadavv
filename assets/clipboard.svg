<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="290" viewBox="0 0 960 290" role="img" aria-labelledby="title description">
  <title id="title">Multi-cursor paste in ttt</title>
  <desc id="description">A regression test pastes Q and R after the first character of abc and xyz. The buffer becomes aQbc and xRyz. One undo restores both original lines.</desc>
<defs><linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f5ecdb"/><stop offset="100%" stop-color="#e9dec8"/></linearGradient></defs>
<style>
.pasted {opacity:1;animation:paste 8s step-end infinite}
.restored {opacity:0;animation:undo 8s step-end infinite}
@keyframes paste {0%,64% {opacity:1} 65%,96% {opacity:0} 97%,100% {opacity:1}}
@keyframes undo {0%,64% {opacity:0} 65%,96% {opacity:1} 97%,100% {opacity:0}}
@media (prefers-reduced-motion: reduce) {.pasted,.restored {animation:none}}
</style>
